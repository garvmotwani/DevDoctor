<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DevDoctor local diagnostics dashboard preview</title>
  <desc id="desc">A dark dashboard with summary cards, developer tools, project facts and a dependency warning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131a"/><stop offset="1" stop-color="#171d2a"/></linearGradient>
    <style>
      .heading{font:700 25px system-ui,sans-serif;fill:#edf2f7}.sub{font:14px system-ui,sans-serif;fill:#a7b0c0}.label{font:600 15px system-ui,sans-serif;fill:#edf2f7}.small{font:13px system-ui,sans-serif;fill:#a7b0c0}.num{font:700 29px system-ui,sans-serif}.body{font:14px system-ui,sans-serif;fill:#dce4ef}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="627" rx="15" fill="#191e29" stroke="#303846"/>
  <text x="60" y="78" class="heading">DevDoctor</text><text x="194" y="78" class="sub">v0.1</text>
  <text x="60" y="105" class="sub">Local-first developer diagnostics</text><text x="60" y="128" class="small">Scanning: C:\projects\sample-app</text>
  <text x="1010" y="84" class="sub" fill="#8cc8ff">Refresh · JSON API</text>
  <rect x="60" y="158" width="330" height="92" rx="10" fill="#141924" stroke="#303846"/><text x="83" y="202" class="num" fill="#8cc8ff">2</text><text x="83" y="230" class="small">Information</text>
  <rect x="435" y="158" width="330" height="92" rx="10" fill="#141924" stroke="#303846"/><text x="458" y="202" class="num" fill="#f9c74f">1</text><text x="458" y="230" class="small">Warnings</text>
  <rect x="810" y="158" width="330" height="92" rx="10" fill="#141924" stroke="#303846"/><text x="833" y="202" class="num" fill="#ff7b7b">0</text><text x="833" y="230" class="small">Errors</text>
  <rect x="60" y="275" width="520" height="160" rx="10" fill="#141924" stroke="#303846"/><text x="84" y="310" class="label">Developer tools</text>
  <text x="84" y="343" class="body">✓ Git</text><text x="225" y="343" class="small">2.39.1</text><text x="84" y="374" class="body">✓ Node.js</text><text x="225" y="374" class="small">24.20.0</text><text x="84" y="405" class="body">✓ Docker</text><text x="225" y="405" class="small">29.7.2</text>
  <rect x="610" y="275" width="530" height="160" rx="10" fill="#141924" stroke="#303846"/><text x="634" y="310" class="label">Project facts</text>
  <text x="634" y="343" class="body">Git repository</text><text x="634" y="374" class="body">framework</text><text x="755" y="374" class="small">— Next.js</text><text x="634" y="405" class="body">package manager</text><text x="795" y="405" class="small">— pnpm</text>
  <rect x="60" y="462" width="1080" height="151" rx="10" fill="#141924" stroke="#f9c74f" stroke-width="2"/><text x="84" y="500" class="label">DEP-001 · Node dependencies may not be installed</text>
  <text x="84" y="530" class="sub">package.json exists, but node_modules was not found.</text><text x="84" y="556" class="sub">Install dependencies before starting the application.</text>
  <rect x="84" y="573" width="108" height="25" rx="5" fill="#0e1219"/><text x="96" y="591" class="small" fill="#edf2f7">pnpm install</text>
</svg>
